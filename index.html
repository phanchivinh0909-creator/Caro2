<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Cờ Caro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        #status {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #007bff;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 35px);
            grid-template-rows: repeat(10, 35px);
            gap: 2px;
            background-color: #ccc;
            border: 2px solid #999;
            padding: 2px;
            border-radius: 4px;
        }
        .cell {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
            .cell:hover {
                background-color: #e9ecef;
            }
            .cell.x {
                color: #dc3545;
            }
            .cell.o {
                color: #28a745;
            }
        #reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
            #reset-btn:hover {
                background-color: #0056b3;
            }
    </style>
</head>
<body>

    <h1>Game Cờ Caro 10x10</h1>
    <div id="status">Lượt của người chơi: X</div>
    <div class="board" id="board"></div>
    <button id="reset-btn" onclick="resetGame()">Chơi Lại</button>

    <script>
        const BOARD_SIZE = 10;
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
        let currentPlayer = 'X';
        let isGameActive = true;

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');

        function createBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', handleCellClick);
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(e) {
            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);

            if (!isGameActive || board[r][c] !== '') return;

            board[r][c] = currentPlayer;
            e.target.textContent = currentPlayer;
            e.target.classList.add(currentPlayer.toLowerCase());

            if (checkWin(r, c)) {
                statusElement.textContent = `Người chơi ${currentPlayer} đã thắng! 🎉`;
                isGameActive = false;
                return;
            }

            if (board.flat().every(cell => cell !== '')) {
                statusElement.textContent = `Hòa mất rồi!`;
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusElement.textContent = `Lượt của người chơi: ${currentPlayer}`;
        }

        function checkWin(r, c) {
            return checkDirection(r, c, 1, 0) || // Hàng ngang
                   checkDirection(r, c, 0, 1) || // Hàng dọc
                   checkDirection(r, c, 1, 1) || // Chéo chính (\)
                   checkDirection(r, c, 1, -1);   // Chéo phụ (/)
        }

        function checkDirection(r, c, dr, dc) {
            let count = 1;
            let player = board[r][c];

            // Kiểm tra hướng tiến
            let i = 1;
            while (r + i * dr >= 0 && r + i * dr < BOARD_SIZE && c + i * dc >= 0 && c + i * dc < BOARD_SIZE && board[r + i * dr][c + i * dc] === player) {
                count++;
                i++;
            }

            // Kiểm tra hướng lùi
            i = 1;
            while (r - i * dr >= 0 && r - i * dr < BOARD_SIZE && c - i * dc >= 0 && c - i * dc < BOARD_SIZE && board[r - i * dr][c - i * dc] === player) {
                count++;
                i++;
            }

            return count >= 5; // 5 ô liên tiếp là thắng
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
            currentPlayer = 'X';
            isGameActive = true;
            statusElement.textContent = `Lượt của người chơi: X`;
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
